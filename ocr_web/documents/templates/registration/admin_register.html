{% extends 'base.html' %}
{% block content %}
<h2>Регистрация администратора</h2>
<p style="color:#e74c3c; margin-bottom:15px;">Внимание: эта страница для создания администраторов системы.</p>
<form method="post" style="max-width:400px;margin-top:20px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn" style="background:#e74c3c;">Зарегистрировать администратора</button>
</form>
<p style="margin-top:15px;"><a href="{% url 'login' %}">← На страницу входа</a></p>
{% endblock %}
